spring.application.name=invoicely-test

# H2 In-Memory Database with PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:invoicely_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS invoicely
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=invoicely

# Flyway Migrations (Validates DDL in test)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=invoicely
spring.flyway.default-schema=invoicely

# MongoDB Test Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/invoicely_test
