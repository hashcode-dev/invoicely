spring.application.name=invoicely

# PostgreSQL / Relational Primary Datasource
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/invoicely}
spring.datasource.username=${POSTGRES_USER:invoicely}
spring.datasource.password=${POSTGRES_PASSWORD:invoicely}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=InvoicelyHikariPool

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# MongoDB Document Store
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/invoicely}
spring.data.mongodb.auto-index-creation=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.hashcode.invoicely=DEBUG
logging.level.org.flywaydb=INFO
logging.file.path=logs/
logging.file.name=logs/application.log
logging.pattern.file=%d %p %c{1.} [%t] %m%n
