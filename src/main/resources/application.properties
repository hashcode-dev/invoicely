spring.application.name=invoicely

# PostgreSQL / Relational Primary Datasource
spring.datasource.url=${SUPABASE_DB_HOST:jdbc:postgresql://localhost:5432/invoicely}
spring.datasource.username=${SUPABASE_DB_USER:invoicely}
spring.datasource.password=${SUPABASE_DB_PASSWORD:invoicely}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=InvoicelyHikariPool
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=invoicely
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=invoicely
spring.flyway.default-schema=invoicely

# MongoDB Document Store
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/invoicely}
spring.data.mongodb.auto-index-creation=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.hashcode.invoicely=DEBUG
logging.level.org.flywaydb=INFO
logging.file.path=logs/
logging.file.name=logs/application.log
logging.pattern.file=%d %p %c{1.} [%t] %m%n
